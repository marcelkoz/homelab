ubuntu_standard_file_mode: '{{ global_standard_file_mode }}'
ubuntu_restricted_file_mode: '{{ global_restricted_file_mode }}'
ubuntu_special_file_mode:
  shadow: '0640'
  cron: '0700'

ubuntu_essential_packages:
  - openssh-server
  - openssh-client
  - rclone # backups

ubuntu_allowed_tcp_ports:
  - 22 # ssh

ubuntu_unnecessary_packages:
  - ftp
  - tnftp
  - telnet
  - rsync
  - restic # backups
