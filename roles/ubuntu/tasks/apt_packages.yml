- name: Install essential packages
  ansible.builtin.apt:
    name: '{{ ubuntu_essential_packages }}'
    state: present
    update_cache: true

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Copy unattended-upgrades configuration
  ansible.builtin.copy:
    src: 'files/50unattended-upgrades'
    dest: '/etc/apt/apt.conf.d/50unattended-upgrades'
    mode: '{{ ubuntu_standard_file_mode }}'
  notify:
    - Unattended-upgrades config changed
