- name: Install ufw package
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Uninstall iptables-persistent to avoid conflits with ufw
  ansible.builtin.apt:
    name: iptables-persistent
    state: absent

- name: Enable ufw and set default policy to deny
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable TCP ports
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: tcp
  loop: '{{ ubuntu_allowed_tcp_ports }}'
