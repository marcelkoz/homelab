- name: Install ufw package
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Uninstall iptables-persistent to avoid conflits with ufw
  ansible.builtin.apt:
    name: iptables-persistent
    state: absent

- name: Enable ufw and set default policy to deny
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable TCP ports
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: tcp
  loop:
    - 443 # https
    - 22 # ssh
    - 53 # dns

- name: Enable UDP ports
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: udp
  loop:
    - 53 # dns
