services:
  # https://docs.goauthentik.io/install-config/install/docker-compose/
  authentik:
    image: "$IMAGE_SOURCE_AUTHENTIK:$IMAGE_TAG_AUTHENTIK"
    container_name: authentik
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - ./authentik/data:/data
      - ./authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS:?database password required}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_ENCRYPTION_KEY:?secret key required}
    networks:
      - proxy
    command: server
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.authentik.rule=Host(`authentik.${METADATA_DOMAIN}`)'
      - 'traefik.http.services.authentik.loadbalancer.server.port=9000'

  authentik-db:
    image: "$IMAGE_SOURCE_POSTGRES:$IMAGE_TAG_POSTGRES"
    container_name: authentik-db
    volumes:
      - authentik-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${AUTHENTIK_DB_NAME:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASS:?database password required}
      POSTGRES_USER: ${AUTHENTIK_DB_USER:-authentik}
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${AUTHENTIK_DB_NAME} -U $${AUTHENTIK_DB_USER}
      timeout: 5s

  authentik-worker:
    image: "$IMAGE_SOURCE_AUTHENTIK:$IMAGE_TAG_AUTHENTIK"
    container_name: authentik-worker
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./authentik/data:/data
      - ./authentik/certs:/certs
      - ./authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS:?database password required}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_ENCRYPTION_KEY:?secret key required}
    networks:
      - proxy
    command: worker
    restart: unless-stopped
    user: root

  daisy-app:
    image: "$IMAGE_SOURCE_DAISY_APP:$IMAGE_TAG_DAISY"
    container_name: daisy-app
    networks:
      - proxy
    restart: unless-stopped

  daisy-web:
    image: "$IMAGE_SOURCE_DAISY_WEB:$IMAGE_TAG_DAISY"
    container_name: daisy-web
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.daisy.rule=Host(`daisy.${METADATA_DOMAIN}`)'
      - 'traefik.http.services.daisy.loadbalancer.server.port=80'

  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: "${IMAGE_SOURCE_GRAFANA}:${IMAGE_TAG_GRAFANA}"
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authentik.${METADATA_DOMAIN}/application/o/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://authentik.${METADATA_DOMAIN}/application/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://authentik.${METADATA_DOMAIN}/application/o/userinfo/"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://authentik.${METADATA_DOMAIN}/application/o/${GRAFANA_OIDC_SLUG}/end-session/"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || contains(groups[*], 'grafana-viewers') && 'Viewer'"
      GF_SERVER_ROOT_URL: https://grafana.${METADATA_DOMAIN}
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana.rule=Host(`grafana.${METADATA_DOMAIN}`)'
      - 'traefik.http.services.grafana.loadbalancer.server.port=3000'

  # https://homarr.dev/docs/getting-started/installation/docker/
  homarr:
    image: "$IMAGE_SOURCE_HOMARR:$IMAGE_TAG_HOMARR"
    container_name: homarr
    volumes:
      - ./homarr/appdata:/appdata
    environment:
      PORT: 80
      SECRET_ENCRYPTION_KEY: ${HOMARR_ENCRYPTION_KEY:?secret key required}
      AUTH_PROVIDERS: oidc
      AUTH_OIDC_ISSUER: "${METADATA_SSO_BASE_URL}/application/o/${HOMARR_OIDC_SLUG}/"
      AUTH_OIDC_URI: "${METADATA_SSO_BASE_URL}/application/o/authorize"
      AUTH_OIDC_CLIENT_NAME: authentik
      AUTH_OIDC_CLIENT_ID: ${HOMARR_OIDC_CLIENT_ID}
      AUTH_OIDC_CLIENT_SECRET: ${HOMARR_OIDC_CLIENT_SECRET}
      AUTH_OIDC_FORCE_USERINFO: true
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.home.rule=Host(`home.${METADATA_DOMAIN}`)'
      - 'traefik.http.services.home.loadbalancer.server.port=80'

  # https://github.com/pi-hole/docker-pi-hole/blob/master/README.md
  pihole:
    image: "$IMAGE_SOURCE_PIHOLE:$IMAGE_TAG_PIHOLE"
    container_name: pihole
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-resolv.conf:/etc/resolv.conf
    env_file:
      - ./pihole/pihole.env
    ports:
      - '53:53/tcp'
      - '53:53/udp'
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pihole.rule=Host(`pihole.${METADATA_DOMAIN}`)'
      - 'traefik.http.services.pihole.loadbalancer.server.port=80'
    cap_add:
      - CAP_CHOWN
      - CAP_SYS_NICE
    dns:
      - 127.0.0.1

  # https://prometheus.io/docs/prometheus/latest/installation/
  prometheus:
    image: "${IMAGE_SOURCE_PROMETHEUS}:${IMAGE_TAG_PROMETHEUS}"
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - proxy
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_STORAGE}'
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.prometheus.rule=Host(`prometheus.${METADATA_DOMAIN}`)'
      - 'traefik.http.services.prometheus.loadbalancer.server.port=9090'

  proxy:
    image: "$IMAGE_SOURCE_TRAEFIK:$IMAGE_TAG_TRAEFIK"
    container_name: proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik
      - ./traefik/config.d:/etc/traefik/config.d
    environment:
      CF_DNS_API_TOKEN: ${SECRET_CLOUDFLARE_API_TOKEN}
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.traefik-dashboard.rule=Host(`proxy.${METADATA_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      - 'traefik.http.routers.traefik-dashboard.service=api@internal'
      # - 'traefik.http.routers.traefik-metrics.rule=Host(`proxy.${METADATA_DOMAIN}`) && PathPrefix(`/metrics`)'
      # - 'traefik.http.routers.traefik-metrics.service=prometheus@internal'

networks:
  proxy:
    name: proxy_network

volumes:
  authentik-db:
    driver: local
  grafana-data: {}
  prometheus-data: {}