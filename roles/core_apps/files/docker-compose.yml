services:

  # https://docs.goauthentik.io/install-config/install/docker-compose/
  authentik:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    container_name: authentik
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - ./authentik/media:/media
      - ./authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_ENCRYPTION_KEY:?secret key required}
    networks:
      - proxy
    command: server
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.authentik.rule=Host(`authentik.${DOMAIN}`)'
      - 'traefik.http.routers.authentik.entryPoints=websecure'
      - 'traefik.http.routers.authentik.tls=true'
      - 'traefik.http.routers.authentik.tls.certresolver=letsencrypt'
      - 'traefik.http.services.authentik.loadbalancer.server.port=9000'

  authentik-db:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: authentik-db
    volumes:
      - authentik-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${AUTHENTIK_DB_NAME:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASS:?database password required}
      POSTGRES_USER: ${AUTHENTIK_DB_USER:-authentik}
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${AUTHENTIK_DB_NAME} -U $${AUTHENTIK_DB_USER}
      timeout: 5s

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    container_name: authentik-worker
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authentik/media:/media
      - ./authentik/certs:/certs
      - ./authentik/custom-templates:/templates
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_ENCRYPTION_KEY:?secret key required}
    networks:
      - proxy
    command: worker
    restart: unless-stopped
    user: root

  daisy-app:
    image: daisy-app
    container_name: daisy-app
    networks:
      - proxy
    restart: unless-stopped

  daisy-web:
    image: daisy-web
    container_name: daisy-web
    depends_on:
      - proxy
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.daisy.rule=Host(`daisy.${DOMAIN}`)'
      - 'traefik.http.routers.daisy.entryPoints=websecure'
      - 'traefik.http.routers.daisy.tls=true'
      - 'traefik.http.routers.daisy.tls.certresolver=letsencrypt'
      - 'traefik.http.services.daisy.loadbalancer.server.port=80'

  # https://docs.gitea.com/installation/install-with-docker
  gitea:
    image: docker.gitea.com/gitea:${GITEA_IMAGE_TAG}
    container_name: gitea
    depends_on:
      - gitea-db
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASS}
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.gitea.rule=Host(`git.${DOMAIN}`)'
      - 'traefik.http.routers.gitea.entryPoints=websecure'
      - 'traefik.http.routers.gitea.tls=true'
      - 'traefik.http.routers.gitea.tls.certresolver=letsencrypt'
      - 'traefik.http.services.gitea.loadbalancer.server.port=3000'

  gitea-db:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: gitea-db
    volumes:
      - gitea-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_PASSWORD: ${GITEA_DB_PASS}
      POSTGRES_USER: ${GITEA_DB_USER}
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${GITEA_DB_NAME} -U $${GITEA_DB_USER}
      timeout: 5s

  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG}
    container_name: grafana
    depends_on:
      - proxy
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authentik.${DOMAIN}/application/o/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://authentik.${DOMAIN}/application/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://authentik.${DOMAIN}/application/o/userinfo/"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://authentik.${DOMAIN}/application/o/${GRAFANA_OIDC_SLUG}/end-session/"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || contains(groups[*], 'grafana-viewers') && 'Viewer'"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)'
      - 'traefik.http.routers.grafana.entryPoints=websecure'
      - 'traefik.http.routers.grafana.tls=true'
      - 'traefik.http.routers.grafana.tls.certresolver=letsencrypt'
      - 'traefik.http.services.grafana.loadbalancer.server.port=3000'

  grafana-loki:
    image: grafana/loki:${GRAFANA_LOKI_IMAGE_TAG}
    container_name: grafana-loki
    volumes:
      - loki-data:/loki:rw
      - ./grafana-loki/loki.yml:/etc/loki/config.yml:r
    command: -config.file=/etc/loki/config.yml
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana-loki.rule=Host(`loki.${DOMAIN}`)'
      - 'traefik.http.routers.grafana-loki.entryPoints=websecure'
      - 'traefik.http.routers.grafana-loki.tls=true'
      - 'traefik.http.routers.grafana-loki.tls.certresolver=letsencrypt'
      - 'traefik.http.services.grafana-loki.loadbalancer.server.port=3100'

  # https://homarr.dev/docs/getting-started/installation/docker/
  homarr:
    image: ghcr.io/homarr-labs/homarr
    container_name: homarr
    depends_on:
      - proxy
    volumes:
      - ./homarr/appdata:/appdata
    environment:
      PORT: 80
      SECRET_ENCRYPTION_KEY: ${HOMARR_ENCRYPTION_KEY}
      AUTH_PROVIDERS: oidc
      AUTH_OIDC_ISSUER: "${SSO_BASE_URL}/application/o/${HOMARR_OIDC_SLUG}/"
      AUTH_OIDC_URI: "${SSO_BASE_URL}/application/o/authorize"
      AUTH_OIDC_CLIENT_NAME: authentik
      AUTH_OIDC_CLIENT_ID: ${HOMARR_OIDC_CLIENT_ID}
      AUTH_OIDC_CLIENT_SECRET: ${HOMARR_OIDC_CLIENT_SECRET}
      AUTH_OIDC_FORCE_USERINFO: true
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.home.rule=Host(`home.${DOMAIN}`)'
      - 'traefik.http.routers.home.entryPoints=websecure'
      - 'traefik.http.routers.home.tls=true'
      - 'traefik.http.routers.home.tls.certresolver=letsencrypt'
      - 'traefik.http.services.home.loadbalancer.server.port=80'

  # https://github.com/pi-hole/docker-pi-hole/blob/master/README.md
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    depends_on:
      - proxy
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-resolv.conf:/etc/resolv.conf
    env_file:
      - ./pihole/pihole.env
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '67:67/udp'
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)'
      - 'traefik.http.routers.pihole.entryPoints=websecure'
      - 'traefik.http.routers.pihole.tls=true'
      - 'traefik.http.routers.pihole.tls.certresolver=letsencrypt'
      - 'traefik.http.services.pihole.loadbalancer.server.port=80'
    cap_add:
      - CAP_CHOWN
      - CAP_SYS_NICE
    dns:
      - 127.0.0.1

  portainer:
    image: portainer/portainer-ce:${PORTAINER_IMAGE_TAG}
    container_name: portainer
    depends_on:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)'
      - 'traefik.http.routers.portainer.entryPoints=websecure'
      - 'traefik.http.routers.portainer.tls=true'
      - 'traefik.http.routers.portainer.tls.certresolver=letsencrypt'
      - 'traefik.http.services.portainer.loadbalancer.server.port=9000'

  # https://prometheus.io/docs/prometheus/latest/installation/
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG}
    container_name: prometheus
    depends_on:
      - proxy
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - proxy
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.size=1GB'
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)'
      - 'traefik.http.routers.prometheus.entryPoints=websecure'
      - 'traefik.http.routers.prometheus.tls=true'
      - 'traefik.http.routers.prometheus.tls.certresolver=letsencrypt'
      - 'traefik.http.services.prometheus.loadbalancer.server.port=9090'

  proxy:
    image: traefik
    container_name: proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/etc/traefik
    environment:
      CF_DNS_API_TOKEN: ${CF_API_TOKEN}
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.traefik-dashboard.rule=Host(`proxy.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      - 'traefik.http.routers.traefik-dashboard.entryPoints=websecure'
      - 'traefik.http.routers.traefik-dashboard.tls=true'
      - 'traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.traefik-dashboard.service=api@internal'
      - 'traefik.http.routers.traefik-metrics.rule=Host(`proxy.${DOMAIN}`) && PathPrefix(`/metrics`)'
      - 'traefik.http.routers.traefik-metrics.entryPoints=websecure'
      - 'traefik.http.routers.traefik-metrics.tls=true'
      - 'traefik.http.routers.traefik-metrics.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.traefik-metrics.service=prometheus@internal'

networks:
  proxy:
    name: proxy_network

volumes:
  authentik-db:
    driver: local
  gitea-db:
    driver: local
  grafana-data: {}
  loki-data: {}
  prometheus-data: {}
  portainer-data: {}
