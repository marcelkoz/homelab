- name: Systemd resolved config changed
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted

- name: SSH config changed
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Traefik configuration changed
  community.docker.docker_compose_v2:
    project_src: '{{ core_apps_base_docker_path }}'
    services:
      - proxy
    state: restarted

- name: Prometheus configuration changed
  community.docker.docker_compose_v2:
    project_src: '{{ core_apps_base_docker_path }}'
    services:
      - prometheus
    state: restarted

- name: Pihole environment changed
  community.docker.docker_compose_v2:
    project_src: '{{ core_apps_base_docker_path }}'
    services:
      - pihole
    state: present
    recreate: always

- name: Glance configuration changed
  community.docker.docker_compose_v2:
    project_src: '{{ core_apps_base_docker_path }}'
    services:
      - glance
    state: restarted
