# https://wiki.archlinux.org/title/SFTP_chroot

- name: Create SFTP directories
  ansible.builtin.file:
    path: '{{ item }}'
    owner: root
    group: root
    mode: '{{ core_apps_sftp_directory_mode }}'
    state: directory
  loop:
    - '{{ core_apps_sftp_bind_mount_path }}'
    - '{{ core_apps_sftp_jail_path }}'
    - '{{ core_apps_sftp_authorised_ssh_keys_path }}'

- name: Bind mount the SFTP jail
  ansible.posix.mount:
    src: '{{ core_apps_sftp_bind_mount_path }}'
    path: '{{ core_apps_sftp_jail_path }}'
    fstype: none
    opts: bind
    state: mounted

- name: Create the SFTP group
  ansible.builtin.group:
    name: '{{ core_apps_sftp_group }}'
    state: present

- name: Create SFTP users
  ansible.builtin.user:
    name: '{{ item }}'
    groups: '{{ core_apps_sftp_group }}'
    shell: /bin/nologin
    home: '{{ core_apps_sftp_jail_path }}'
    state: present
  loop: '{{ core_apps_sftp_users }}'

- name: Create SFTP users
  ansible.builtin.user:
    name: '{{ item }}'
    groups: '{{ core_apps_sftp_group }}'
    shell: /bin/nologin
    home: '{{ core_apps_sftp_jail_path }}'
    state: present
  loop: '{{ core_apps_sftp_users }}'

- name: Copy SFTP user directories
  ansible.builtin.file:
    path: '{{ core_apps_sftp_jail_path }}/{{ item }}'
    owner: '{{ item }}'
    group: '{{ item }}'
    mode: '{{ core_apps_sftp_directory_mode }}'
    state: directory
  loop: '{{ core_apps_sftp_users }}'

- name: Create backup scripts directory
  ansible.builtin.file:
    path: '{{ core_apps_backups_config_path }}'
    mode: '{{ core_apps_restricted_directory_mode }}'
    state: directory

- name: Copy backup script template
  ansible.builtin.template:
    src: templates/core-apps-backup.sh.j2
    dest: '{{ core_apps_backups_script_path }}'
    mode: '{{ core_apps_restricted_file_mode }}'

- name: Copy systemd service template
  ansible.builtin.template:
    src: templates/core-apps-backup.service.j2
    dest: /etc/systemd/system/core-apps-backup.service
    mode: '{{ core_apps_restricted_file_mode }}'

- name: Copy systemd timer template
  ansible.builtin.template:
    src: templates/core-apps-backup.timer.j2
    dest: /etc/systemd/system/core-apps-backup.timer
    mode: '{{ core_apps_restricted_file_mode }}'

- name: Create rclone configuration directory in root home
  ansible.builtin.file:
    path: /root/.config/rclone
    mode: '{{ core_apps_restricted_directory_mode }}'
    state: directory

- name: Copy rclone configuration
  ansible.builtin.template:
    src: templates/rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    mode: '{{ core_apps_restricted_file_mode }}'

- name: Copy azure service principle file
  ansible.builtin.copy:
    src: '{{ core_apps_runtime_path }}/{{ deployment_environment }}-{{ core_apps_backups_azure_service_principle_file_name }}'
    dest: '{{ core_apps_backups_config_path }}'
    mode: '{{ core_apps_restricted_file_mode }}'

- name: Enable backup service timer
  ansible.builtin.systemd_service:
    name: core-apps-backup.timer
    state: started
    enabled: true
