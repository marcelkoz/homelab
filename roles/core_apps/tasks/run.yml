# docker compose up --build --detach
- name: Run docker compose services
  community.docker.docker_compose_v2:
    project_src: '{{ core_apps_service_path.docker }}'
    pull: missing
    build: always
    state: present

- name: Delete all unused docker images, containers and volumes
  community.docker.docker_prune:
    containers: true
    images: true
    volumes: true
