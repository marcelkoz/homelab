- name: Disable grafana loki docker plugin
  # Note: this breaks if the plugin is enabled
  community.docker.docker_plugin:
    plugin_name: 'grafana/loki-docker-driver'
    alias: loki
    state: absent

- name: Delete docker service data directories
  ansible.builtin.file:
    path: '{{ core_apps_base_docker_path }}/{{ item }}'
    state: absent
  loop:
    - actual-budget
    - gitea
    - grafana-loki

- name: Delete old backups service principal file
  ansible.builtin.file:
    path: '{{ core_apps_backups_config_path }}/{{ global_deployment_environment }}-{{ core_apps_backups_azure_service_principle_file_name }}'
    state: absent
