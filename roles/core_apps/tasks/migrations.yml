- name: Disable grafana loki docker plugin
  # Note: this breaks if the plugin is enabled
  community.docker.docker_plugin:
    plugin_name: 'grafana/loki-docker-driver'
    alias: loki
    state: absent

- name: Delete actual-budget data directory
  ansible.builtin.file:
    path: '{{ core_apps_base_docker_path }}/actual-budget'
    state: absent

- name: Delete gitea data directory
  ansible.builtin.file:
    path: '{{ core_apps_base_docker_path }}/gitea'
    state: absent
