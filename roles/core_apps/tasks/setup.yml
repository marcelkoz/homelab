- name: Enable TCP ports on the firewall relevant to the docker containers
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: tcp
  loop: '{{ core_apps_allowed_tcp_ports }}'

- name: Enable UDP ports on the firewall relevant to the docker containers
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: udp
  loop: '{{ core_apps_allowed_udp_ports }}'

- name: Disable systemd resolved default dns stub listener
  ansible.builtin.copy:
    src: 'files/etc-systemd-resolved.conf'
    dest: '/etc/systemd/resolved.conf'
    mode: '{{ core_apps_standard_file_mode }}'
  notify:
    - Systemd resolved config changed

- name: Install grafana loki docker plugin
  community.docker.docker_plugin:
    plugin_name: 'grafana/loki-docker-driver'
    alias: loki
    state: enable

- name: Create directories for docker containers
  ansible.builtin.file:
    path: '{{ item }}'
    mode: '{{ core_apps_restricted_directory_mode }}'
    state: directory
    owner: '{{ core_apps_docker_user }}'
    group: '{{ core_apps_docker_group }}'
  loop:
    - '{{ core_apps_service_path.traefik }}'
    - '{{ core_apps_service_path.pihole }}'
    - '{{ core_apps_service_path.homarr }}'
    - '{{ core_apps_service_path.authentik }}'
    - '{{ core_apps_service_path.authentik_media }}'
    - '{{ core_apps_service_path.gitea }}'
    - '{{ core_apps_service_path.grafana }}'
    - '{{ core_apps_service_path.actual_budget }}'

- name: Copy authentik branding assets
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ core_apps_service_path.authentik_media }}'
    mode: '{{ core_apps_restricted_file_mode }}'
  loop:
    - '{{ core_apps_assets_path }}/homelab_favicon.svg'
    - '{{ core_apps_assets_path }}/homelab_logo.svg'
    - '{{ core_apps_assets_path }}/homelab_logo_black.svg'
    - '{{ core_apps_assets_path }}/homelab_logo_white.svg'
    - '{{ core_apps_assets_path }}/homelab_logo_shadow.svg'

- name: Create directory for daisy docker container
  ansible.builtin.file:
    path: '{{ core_apps_service_path.daisy }}'
    mode: '{{ core_apps_restricted_directory_mode }}'
    state: directory
    owner: root
    group: root

- name: Create directory for prometheus docker container (which has different user/group)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '{{ core_apps_restricted_directory_mode }}'
    state: directory
    owner: '{{ core_apps_prometheus_docker_user }}'
    group: '{{ core_apps_prometheus_docker_group }}'
  loop:
    - '{{ core_apps_service_path.prometheus }}'

- name: Create directory for grafana loki docker container (which has different user/group)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '{{ core_apps_restricted_directory_mode }}'
    state: directory
    owner: '{{ core_apps_grafana_loki_docker_user }}'
    group: '{{ core_apps_grafana_loki_docker_group }}'
  loop:
    - '{{ core_apps_service_path.grafana_loki }}'

- name: Copy docker configuration
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ core_apps_service_path.docker }}'
    mode: '{{ core_apps_restricted_file_mode }}'
  loop:
    - '{{ core_apps_runtime_path }}/.env'
    - 'files/docker-compose.yml'

- name: Copy pihole configuration
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ core_apps_service_path.pihole }}'
    mode: '{{ core_apps_restricted_file_mode }}'
  loop:
    - 'files/etc-resolv.conf'

- name: Copy pihole configuration template
  ansible.builtin.template:
    src: '{{ item }}'
    dest: '{{ core_apps_service_path.pihole }}/pihole.env'
    mode: '{{ core_apps_restricted_file_mode }}'
  loop:
    - 'templates/pihole.env.j2'

- name: Copy traefik configuration template
  ansible.builtin.template:
    src: '{{ item }}'
    dest: '{{ core_apps_service_path.traefik }}/traefik.yml'
    mode: '{{ core_apps_restricted_file_mode }}'
  loop:
    - 'templates/traefik.yml.j2'

- name: Create traefik directories
  ansible.builtin.file:
    path: '{{ item }}'
    mode: '{{ core_apps_restricted_directory_mode }}'
    state: directory
  loop:
    - '{{ core_apps_service_path.traefik }}/certs'
    - '{{ core_apps_service_path.traefik }}/config.d'

- name: Create blank acme file for proxy tls traffic
  ansible.builtin.file:
    path: '{{ core_apps_service_path.traefik }}/certs/acme.json'
    mode: '{{ core_apps_special_file_mode.traefik_certs }}'
    state: touch
    modification_time: preserve
    access_time: preserve

- name: Copy prometheus configuration template
  ansible.builtin.template:
    src: '{{ item }}'
    dest: '{{ core_apps_service_path.prometheus }}/prometheus.yml'
    mode: '{{ core_apps_restricted_file_mode }}'
    owner: '{{ core_apps_prometheus_docker_user }}'
    group: '{{ core_apps_prometheus_docker_group }}'
  loop:
    - 'templates/prometheus.yml.j2'

- name: Copy grafana loki configuration
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ core_apps_service_path.grafana_loki }}'
    mode: '{{ core_apps_restricted_file_mode }}'
    owner: '{{ core_apps_grafana_loki_docker_user }}'
    group: '{{ core_apps_grafana_loki_docker_group }}'
  loop:
    - 'files/loki.yml'
