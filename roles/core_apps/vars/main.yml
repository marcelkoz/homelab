core_apps_allowed_tcp_ports:
  - 443 # https
  - 80 # http
  - 53 # dns

core_apps_allowed_udp_ports:
  - 53 # dns

core_apps_standard_file_mode: '0644'
core_apps_restricted_file_mode: '0400'
core_apps_restricted_directory_mode: '0700'
core_apps_special_file_mode:
  traefik_certs: '0600'

core_apps_docker_user: 1000
core_apps_docker_group: 1000

core_apps_prometheus_docker_user: nobody
core_apps_prometheus_docker_group: nogroup

core_apps_daisy_repo: git@github.com:marcelkoz/daisy.git

core_apps_runtime_path: ../../runtime/application_servers
core_apps_assets_path: ../../assets
core_apps_base_docker_path: /home/ansible/docker
core_apps_service_path:
  traefik: '{{ core_apps_base_docker_path }}/traefik'
  pihole: '{{ core_apps_base_docker_path }}/pihole'
  daisy: '{{ core_apps_base_docker_path }}/daisy'
  homarr: '{{ core_apps_base_docker_path }}/homarr'
  authentik: '{{ core_apps_base_docker_path }}/authentik'
  authentik_media: '{{ core_apps_base_docker_path }}/authentik/data/media/public'
  gitea: '{{ core_apps_base_docker_path }}/gitea'
  prometheus: '{{ core_apps_base_docker_path }}/prometheus'
  grafana: '{{ core_apps_base_docker_path }}/grafana'
  actual_budget: '{{ core_apps_base_docker_path }}/actual-budget'

core_apps_backups_user: root
core_apps_backups_path: /tmp/core-apps-backups
core_apps_backups_config_path: /home/ansible/backups
core_apps_backups_script_path: '{{ core_apps_backups_config_path }}/core-apps-backup.sh'
core_apps_backups_timer_calendar: 'Sat *-*-* 03:00:00'
core_apps_backups_timer_randomised: 30
core_apps_backups_azure_service_principle_file_name: backups-sp.json
core_apps_backups_azure_blob_container_name: core-apps-backups
core_apps_backups_rclone_azure_remote_name: coreappsbackups_blob
core_apps_backups_authentik_database_container_name: authentik-db
core_apps_backups_authentik_database_name: authentik
core_apps_backups_authentik_database_user: weeman

core_apps_sftp_users:
  - opnsense
core_apps_sftp_group: sftponly
core_apps_sftp_directory_mode: '0755'
core_apps_sftp_bind_mount_path: /mnt/data/sftp
core_apps_sftp_jail_path: /srv/ssh/jail
core_apps_sftp_authorised_ssh_keys_path: /etc/ssh/authorized_keys
