core_apps_allowed_tcp_ports:
  - 443 # https
  - 80 # http
  - 53 # dns

core_apps_allowed_udp_ports:
  - 53 # dns

core_apps_standard_file_mode: '0644'
core_apps_restricted_file_mode: '0400'
core_apps_restricted_directory_mode: '0700'
core_apps_special_file_mode:
  traefik_certs: '0600'

core_apps_docker_user: 1000
core_apps_docker_group: 1000

core_apps_prometheus_docker_user: nobody
core_apps_prometheus_docker_group: nogroup

core_apps_grafana_loki_docker_user: 10001
core_apps_grafana_loki_docker_group: 10001

core_apps_daisy_repo: git@github.com:marcelkoz/daisy.git

core_apps_runtime_path: ../../runtime/application_servers
core_apps_service_path:
  docker: /home/ansible/docker
  traefik: /home/ansible/docker/traefik
  pihole: /home/ansible/docker/pihole
  daisy: /home/ansible/docker/daisy
  homarr: /home/ansible/docker/homarr
  authentik: /home/ansible/docker/authentik
  gitea: /home/ansible/docker/gitea
  prometheus: /home/ansible/docker/prometheus
  grafana: /home/ansible/docker/grafana
  grafana_loki: /home/ansible/docker/grafana-loki
  actual_budget: /home/ansible/docker/actual-budget

core_apps_backups_user: root
core_apps_backups_path: /tmp/core-apps-backups
core_apps_backups_config_path: /home/ansible/backups
core_apps_backups_copy_script_path: /home/ansible/backups/core-apps-backup.sh
core_apps_backups_timer_calendar: 'Sat *-*-* 03:00:00'
core_apps_backups_timer_randomised: 30
core_apps_backups_azure_service_principle_file_name: backups-sp.json
core_apps_backups_azure_blob_container_name: core-apps-backups
core_apps_backups_rclone_azure_remote_name: coreappsbackups_blob
