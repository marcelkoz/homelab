core_apps_docker_user: 1000
core_apps_docker_group: 1000

core_apps_prometheus_docker_user: nobody
core_apps_prometheus_docker_group: nogroup

core_apps_grafana_loki_docker_user: 10001
core_apps_grafana_loki_docker_group: 10001

core_apps_daisy_repo: git@github.com:marcelkoz/daisy.git

core_apps_runtime_path: ../../runtime/application_servers
core_apps_service_path:
  docker: /home/ansible/docker
  traefik: /home/ansible/docker/traefik
  pihole: /home/ansible/docker/pihole
  daisy: /home/ansible/docker/daisy
  homarr: /home/ansible/docker/homarr
  authentik: /home/ansible/docker/authentik
  gitea: /home/ansible/docker/gitea
  prometheus: /home/ansible/docker/prometheus
  grafana: /home/ansible/docker/grafana
  grafana_loki: /home/ansible/docker/grafana-loki
