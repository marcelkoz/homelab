# vars from group_vars/application_servers.yml

- name: Setup the docker environment
  hosts: application_servers
  tags: setup
  # root
  become: true

  tasks:
    - name: Enable and start docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create directories for docker containers
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0700'
        state: directory
        owner: '{{ docker_user }}'
        group: '{{ docker_group }}'
      loop:
        - '{{ server_path.traefik }}'
        - '{{ server_path.pihole }}'
        - '{{ server_path.daisy }}'
        - '{{ server_path.homarr }}'
        - '{{ server_path.authentik }}'
        - '{{ server_path.gitea }}'
        - '{{ server_path.grafana }}'

    - name: Create directory for prometheus docker container (which has different user/group)
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0700'
        state: directory
        owner: nobody
        group: nogroup
      loop:
        - '{{ server_path.prometheus }}'

    - name: Copy docker configuration
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ server_path.docker }}'
        mode: '0400'
      loop:
        - '{{ local_path.runtime }}/.env'
        - '{{ local_path.config }}/docker-compose.yml'

    - name: Disable systemd resolved default dns stub listener
      ansible.builtin.copy:
        src: '{{ local_path.config }}/etc-systemd-resolved.conf'
        dest: '/etc/systemd/resolved.conf'
        mode: '0644'
      notify:
        - Systemd resolved config changed

    - name: Copy pihole configuration
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ server_path.pihole }}'
        mode: '0400'
      loop:
        - '{{ local_path.runtime }}/pihole.env'
        - '{{ local_path.config }}/etc-resolv.conf'

    - name: Copy traefik configuration
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ server_path.traefik }}'
        mode: '0400'
      loop:
        - '{{ local_path.runtime }}/traefik.yml'

    - name: Create traefik certs directory
      ansible.builtin.file:
        path: "{{ server_path.traefik }}/certs"
        mode: '0400'
        state: directory

    - name: Create blank acme file for proxy tls traffic
      ansible.builtin.file:
        path: "{{ server_path.traefik }}/certs/acme.json"
        mode: '0600'
        state: touch
        modification_time: preserve
        access_time: preserve

    - name: Copy prometheus configuration template
      ansible.builtin.template:
        src: '{{ item }}'
        dest: '{{ server_path.prometheus }}/prometheus.yml'
        mode: '0400'
        owner: nobody
        group: nogroup
      loop:
        - '{{ local_path.config }}/prometheus.yml.j2'

  handlers:
    - name: Systemd resolved config changed
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted

- name: Build custom container images
  hosts: application_servers
  tags: build
  # root
  become: true

  tasks:
    - name: Copy SSH private key for the Daisy git repository
      ansible.builtin.copy:
        src: '{{ local_path.runtime }}/daisy_git_key'
        dest: '{{ server_path.docker }}'
        mode: '0400'

    - name: Pull Daisy git repository
      # noqa latest
      ansible.builtin.git:
        repo: 'git@github.com:marcelkoz/daisy.git'
        dest: '{{ server_path.daisy }}'
        accept_hostkey: true
        version: HEAD
        key_file: '{{ server_path.docker }}/daisy_git_key'

    - name: Build daisy-web container image
      community.docker.docker_image_build:
        name: daisy-web
        path: '{{ server_path.daisy }}/web'
        dockerfile: Dockerfile

    - name: Build daisy-app container image
      community.docker.docker_image_build:
        name: daisy-app
        path: '{{ server_path.daisy }}/app'
        dockerfile: Dockerfile

    - name: Check if Daisy SSH private key exists
      ansible.builtin.stat:
        path: "{{ server_path.docker }}/daisy_git_key"
      register: daisy_key_file

    - name: Remove Daisy SSH private key if found
      ansible.builtin.file:
        path: "{{ server_path.docker }}/daisy_git_key"
        state: absent
      when: daisy_key_file.stat.exists | default(false)

- name: Update third-party docker images
  hosts: application_servers
  tags: update
  # root
  become: true

  tasks:
    - name: Update container images
      community.docker.docker_image:
        name: '{{ item }}'
        source: pull
      loop:
        - 'ghcr.io/ajnart/homarr:latest'
        - 'pihole/pihole:latest'
        - 'traefik:latest'

- name: Run the docker environment
  hosts: application_servers
  tags: run
  # root
  become: true

  tasks:
    # docker compose up --build --detach
    - name: Run docker compose services
      community.docker.docker_compose_v2:
        project_src: '{{ server_path.docker }}'
        pull: missing
        build: always
        state: present

    - name: Delete all unused docker images, containers and volumes
      community.docker.docker_prune:
        containers: true
        images: true
        volumes: true
