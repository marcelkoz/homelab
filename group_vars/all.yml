ansible_user: ansible
global_timezone: Europe/London
global_dns_upstream_servers:
  - '1.1.1.1'
  - '1.0.0.1'
  - '8.8.8.8'
  - '8.8.4.4'
global_json_config:
  sort_keys: true
  indent: 2

# rw- r-- r--
global_standard_file_mode: '0644'
# rwx r-x r-x
global_standard_directory_mode: '0755'

# rw- --- ---
global_restricted_file_mode: '0600'
# r-- --- ---
global_restricted_readonly_file_mode: '0400'
# rwx --- ---
global_restricted_directory_mode: '0700'
