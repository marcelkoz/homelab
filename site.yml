- name: Apply distro specific configuration
  hosts: all
  become: true
  tags: os_build

  tasks:
    - name: OS distrubution of each host
      ansible.builtin.debug:
        var: ansible_facts['distribution']

    - name: Apply Ubuntu configuration
      ansible.builtin.include_role:
        name: ubuntu
      when: ansible_facts['distribution'] | lower == 'ubuntu'

- name: Netbird server configuration
  hosts: netbird_servers
  become: true
  tags: netbird

  roles:
    - netbird_server

- name: Core apps server configuration
  hosts: application_servers
  become: true
  tags: core_apps

  roles:
    - core_apps
