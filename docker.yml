- name: Docker setup
  hosts: servers
  # root
  become: true
  vars:
    docker: /root/docker
    traefik: /root/docker/traefik
    pihole: /root/docker/pihole
    daisy: /root/docker/daisy
    homarr: /root/docker/homarr

  vars_prompt:
    - name: "git_user"
      prompt: "Enter your git username"
      private: false
    - name: "git_password"
      prompt: "Enter your git password"
      private: true

  tasks:
    - name: Enable and start docker service
      ansible.builtin.service:
        name: docker
        enabled: yes
        state: started
      tags: setup

    - name: Create directories for docker containers
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0400'
        state: directory
      loop:
        - '{{ traefik }}'
        - '{{ pihole }}'
        - '{{ daisy }}'
        - '{{ homarr }}'
      tags: setup

    - name: Create blank acme file for proxy tls traffic
      ansible.builtin.file:
        path: "{{ traefik }}/certs/acme.json"
        mode: '0600'
        state: touch
      tags: setup

    - name: Copy docker configuration
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ docker }}'
        mode: '0400'
      loop:
        - runtime/.env
        - config/docker/docker-compose.yml
      tags: setup

    - name: Disable systemd resolved default dns stub listener
      ansible.builtin.copy:
        src: 'config/docker/etc-systemd-resolved.conf'
        dest: '/etc/systemd/resolved.conf'
        mode: '0644'
      tags: setup

    - name: Reload systemd resolved to apply changes
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
      tags: setup

    - name: Copy pihole configuration
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ pihole }}'
        mode: '0400'
      loop:
        - runtime/pihole.env
        - config/docker/etc-resolv.conf
      tags: setup

    - name: Copy traefik configuration
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ traefik }}'
        mode: '0400'
      loop:
        - runtime/traefik.yml
      tags: setup

    - name: Clone daisy git repo
      ansible.builtin.expect:
        command: git clone https://github.com/marcelkoz/daisy .
        chdir: '{{ daisy }}'
        responses:
          (.*)Username(.*): "{{ git_user }}"
          (.*)Password(.*): "{{ git_password }}"
      tags: clone

    - name: Pull daisy git repo (update)
      ansible.builtin.expect:
        command: git pull
        chdir: '{{ daisy }}'
        responses:
          (.*)Username(.*): "{{ git_user }}"
          (.*)Password(.*): "{{ git_password }}"
      tags: update

    - name: Update container images
      ansible.builtin.command:
        cmd: 'docker pull {{ item }}'
        chdir: '{{ docker }}'
      loop:
        - 'pihole/pihole:latest'
        - 'traefik'
      tags: update

    - name: Build daisy frontend
      ansible.builtin.command:
        cmd: docker build . --tag daisy-web
        chdir: '{{ daisy }}/web'
      tags: build

    - name: Build daisy backend
      ansible.builtin.command:
        cmd: docker build . --tag daisy-app
        chdir: '{{ daisy }}/app'
      tags: build

    - name: Run docker compose
      ansible.builtin.command:
        cmd: docker compose up --build --detach
        chdir: '{{ docker }}'
      tags: run

    - name: Delete all unused docker images and containers
      ansible.builtin.command:
        cmd: docker system prune -f
        chdir: '{{ docker }}'
      tags: run
