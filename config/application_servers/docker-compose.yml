
services:
  proxy:
    container_name: proxy
    image: traefik
    networks:
      - proxy
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/etc/traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.dashboard.rule=Host(`proxy.${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      - 'traefik.http.routers.dashboard.entryPoints=websecure'
      - 'traefik.http.routers.dashboard.tls=true'
      - 'traefik.http.routers.dashboard.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.dashboard.service=api@internal'
    environment:
      - 'CF_DNS_API_TOKEN=${CF_API_TOKEN}'
    restart: unless-stopped

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr
    networks:
      - proxy
    volumes:
      - ./homarr/appdata:/appdata
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.home.rule=Host(`home.${DOMAIN}`)'
      - 'traefik.http.routers.home.entryPoints=websecure'
      - 'traefik.http.routers.home.tls=true'
      - 'traefik.http.routers.home.tls.certresolver=letsencrypt'
      - 'traefik.http.services.home.loadbalancer.server.port=80'
    environment:
      - 'PORT=80'
      - 'SECRET_ENCRYPTION_KEY=${HOMARR_ENCRYPTION_KEY}'
      - 'AUTH_PROVIDERS=oidc'
      - 'AUTH_OIDC_ISSUER=${SSO_BASE_URL}/application/o/${HOMARR_OIDC_SLUG}/'
      - 'AUTH_OIDC_URI=${SSO_BASE_URL}/application/o/authorize'
      - 'AUTH_OIDC_CLIENT_NAME=authentik'
      - 'AUTH_OIDC_CLIENT_ID=${HOMARR_OIDC_CLIENT_ID}'
      - 'AUTH_OIDC_CLIENT_SECRET=${HOMARR_OIDC_CLIENT_SECRET}'
      - 'AUTH_OIDC_FORCE_USERINFO=true'
    depends_on:
      - proxy
    restart: unless-stopped

  # https://github.com/pi-hole/docker-pi-hole/blob/master/README.md
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    networks:
      - proxy
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
    dns:
      - 127.0.0.1
    cap_add:
      - NET_ADMIN
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      - ./pihole/etc-resolv.conf:/etc/resolv.conf
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)'
      - 'traefik.http.routers.pihole.entryPoints=websecure'
      - 'traefik.http.routers.pihole.tls=true'
      - 'traefik.http.routers.pihole.tls.certresolver=letsencrypt'
      - 'traefik.http.services.pihole.loadbalancer.server.port=80'
    env_file:
      - ./pihole/pihole.env
    depends_on:
      - proxy
    restart: unless-stopped

  daisy-web:
    container_name: daisy-web
    image: daisy-web
    networks:
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.daisy.rule=Host(`daisy.${DOMAIN}`)'
      - 'traefik.http.routers.daisy.entryPoints=websecure'
      - 'traefik.http.routers.daisy.tls=true'
      - 'traefik.http.routers.daisy.tls.certresolver=letsencrypt'
      - 'traefik.http.services.daisy.loadbalancer.server.port=80'
    depends_on:
      - proxy
    restart: unless-stopped

  daisy-app:
    container_name: daisy-app
    image: daisy-app
    networks:
      - proxy
    restart: unless-stopped

  authentik-db:
    container_name: authentik-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTHENTIK_DB_NAME:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASS:?database password required}
      POSTGRES_USER: ${AUTHENTIK_DB_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${AUTHENTIK_DB_NAME} -U $${AUTHENTIK_DB_USER}
      timeout: 5s
    volumes:
    - authentik-db:/var/lib/postgresql/data
    networks:
      - proxy
    restart: unless-stopped

  authentik:
    container_name: authentik
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    command: server
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_ENCRYPTION_KEY:?secret key required}
    volumes:
    - './authentik/media:/media'
    - './authentik/custom-templates:/templates'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.authentik.rule=Host(`authentik.${DOMAIN}`)'
      - 'traefik.http.routers.authentik.entryPoints=websecure'
      - 'traefik.http.routers.authentik.tls=true'
      - 'traefik.http.routers.authentik.tls.certresolver=letsencrypt'
      - 'traefik.http.services.authentik.loadbalancer.server.port=9000'
    networks:
      - proxy
    restart: unless-stopped

  authentik-worker:
    container_name: authentik-worker
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    command: worker
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_ENCRYPTION_KEY:?secret key required}
    user: root
    volumes:
    - '/var/run/docker.sock:/var/run/docker.sock'
    - './authentik/media:/media'
    - './authentik/certs:/certs'
    - './authentik/custom-templates:/templates'
    networks:
      - proxy
    restart: unless-stopped

  gitea-db:
    container_name: gitea-db
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_PASSWORD: ${GITEA_DB_PASS}
      POSTGRES_USER: ${GITEA_DB_USER}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${GITEA_DB_NAME} -U $${GITEA_DB_USER}
      timeout: 5s
    volumes:
      - gitea-db:/var/lib/postgresql/data
    networks:
      - proxy
    restart: unless-stopped

  gitea:
    container_name: gitea
    image: docker.gitea.com/gitea:${GITEA_IMAGE_TAG}
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASS}
    volumes:
      - './gitea:/data'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.gitea.rule=Host(`git.${DOMAIN}`)'
      - 'traefik.http.routers.gitea.entryPoints=websecure'
      - 'traefik.http.routers.gitea.tls=true'
      - 'traefik.http.routers.gitea.tls.certresolver=letsencrypt'
      - 'traefik.http.services.gitea.loadbalancer.server.port=3000'
    depends_on:
      - gitea-db
    networks:
      - proxy
    restart: unless-stopped

volumes:
  authentik-db:
    driver: local
  gitea-db:
    driver: local

networks:
  proxy:
    name: proxy_network

