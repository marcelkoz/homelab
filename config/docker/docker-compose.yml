
services:
  proxy:
    container_name: proxy
    image: traefik
    command: --api.insecure=true --providers.docker
    networks:
      - internal
    ports:
      - 80:80
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # https://github.com/pi-hole/docker-pi-hole/blob/master/README.md
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    networks:
      - internal
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
    dns:
      - 127.0.0.1
    env_file:
      - pihole.env
      - docker.env
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      - ./pihole/etc-resolv.conf:/etc/resolv.conf
    cap_add:
      - NET_ADMIN
    labels:
      - 'traefik.http.routers.pihole.rule=Host(`pihole`) || Host(`pihole.${DOMAIN}`)'
      - 'traefik.http.routers.pihole.middlewares=pihole-admin'
      - 'traefik.http.services.pihole.loadbalancer.server.port=80'
      - 'traefik.http.middlewares.pihole-admin.addprefix.prefix=/admin'
    depends_on:
      - proxy
    restart: unless-stopped

  daisy:
    container_name: daisy
    image: daisy-web
    networks:
      - internal
    env_file:
      - docker.env
    labels:
      - 'traefik.http.routers.daisy.rule=Host(`daisy`) || Host(`daisy.${DOMAIN}`)'
      - 'traefik.http.services.daisy.loadbalancer.server.port=80'
    restart: unless-stopped

  daisy-backend:
    container_name: daisy-backend
    image: daisy-app
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    name: internal_network
