
# set warning banner
Banner /etc/issue.net

# set session timeout intervals
ClientAliveCountMax 3
ClientAliveInterval 60

# disable host based authentication (unused)
HostbasedAuthentication no

# ignore rhost files
IgnoreRhosts yes

# disable empty passwords
PermitEmptyPasswords no

# ignore ssh enviornment vars
PermitUserEnvironment no

# use PAM authentication
UsePAM yes

# disable root login
PermitRootLogin no

# set login timeout
LoginGraceTime 60

# login and logout events will be logged
LogLevel INFO

# set max login attempts
MaxAuthTries 3

# set max sessions per TCP stream
MaxSessions 10

# set unauthenticated session dropout rate (start:rate:full)
MaxStartups 10:30:60

# enable the most secure ciphers
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# enable the most secure key exchange algorithms
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256

# enable the most secure hash algorithms
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
