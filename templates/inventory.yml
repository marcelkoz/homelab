application_servers:
  vars:
    ansible_user: ansible
    traefik_fqdn: proxy.example.com
    traefik_letsencrypt_email_address: email@example.com
    pihole_fqdn: pihole.example.com
    pihole_password: "{{ pihole_admin_password }}" # ansible vault
  hosts:
    SERVER1:
      ansible_host: FQDN
      ansible_ssh_private_key_file: ~/.ssh/ansible
      anisble_become_pass: "{{ VAR1 }}"
    SERVER2:
      ansible_host: FQDN
      ansible_ssh_private_key_file: ~/.ssh/ansible
      anisble_become_pass: "{{ VAR2 }}"

netbird_servers:
  vars:
      ansible_user: USER
  hosts:
    SERVER1:
      ansible_host: FQDN
      ansible_ssh_private_key_file: ~/.ssh/ansible
      anisble_become_pass: "{{ VAR1 }}"
    SERVER2:
      ansible_host: FQDN
      ansible_ssh_private_key_file: ~/.ssh/ansible
      anisble_become_pass: "{{ VAR2 }}"
