
api:
  dashboard: true

entryPoints:
  web:
    address: ':80'
  websecure:
    address: ':443'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false

certificatesResolvers:
  letsencrypt:
    acme:
      email: <<EMAIL>>
      storage: '/etc/traefik/certs/acme.json'
      dnsChallenge:
        provider: cloudflare
