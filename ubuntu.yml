# vars from group_vars/vpn_servers.yml

- name: Update and install packages
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Update apt cache and all packages
      # noqa package-latest
      ansible.builtin.apt:
        name: '*'
        state: latest
        update_cache: true

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - openssh-server
          - openssh-client
        state: present
        update_cache: true

- name: Enable automatic package updates
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Install unattended-upgrades package
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Copy unattended-upgrades configuration
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/50unattended-upgrades'
        dest: '/etc/apt/apt.conf.d/50unattended-upgrades'
        mode: '0644'
      notify:
        - Unattended-upgrades config changed

  handlers:
    - name: Unattended-upgrades config changed
      ansible.builtin.service:
        name: unattended-upgrades
        state: restarted

- name: Configure firewall
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Install ufw package
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Uninstall iptables-persistent to avoid conflits with ufw
      ansible.builtin.apt:
        name: iptables-persistent
        state: absent

    - name: Enable ufw and set default policy to deny
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Enable TCP ports
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
      loop:
        - 443 # https
        - 22 # ssh

- name: Miscellaneous configuration
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Set the timezone
      community.general.timezone:
        name: '{{ timezone }}'

    - name: Create timesyncd.conf.d directory
      ansible.builtin.file:
        path: '/etc/systemd/timesyncd.conf.d'
        state: directory
        mode: '0644'

    - name: Copy NTP servers config
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/00-ntp-servers.conf'
        dest: '/etc/systemd/timesyncd.conf.d/00-ntp-servers.conf'
        mode: '0644'
      notify:
        - NTP config changed

  handlers:
    - name: NTP config changed
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted


- name: Enable general hardening measures
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Restrict shadow and gshadow file permissions
      ansible.builtin.file:
        path: '{{ item }}'
        state: file
        mode: '0640'
      loop:
        - '/etc/shadow'
        - '/etc/gshadow'
        - '/etc/shadow-'
        - '/etc/gshadow-'

    - name: Restrict cron directory permissions
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - '/etc/cron.d'
        - '/etc/cron.daily'
        - '/etc/cron.hourly'
        - '/etc/cron.monthly'
        - '/etc/cron.weekly'

    - name: Restrict crontab permissions
      ansible.builtin.file:
        path: '/etc/crontab'
        state: file
        mode: '0600'

    - name: Create blank at.allow and cron.allow files
      ansible.builtin.file:
        path: '{{ item }}'
        state: touch
        mode: '0600'
      loop:
        - '/etc/at.allow'
        - '/etc/cron.allow'

    - name: Set cron.allow group to crontab
      ansible.builtin.file:
        path: '/etc/cron.allow'
        state: file
        group: crontab

    - name: Restrict grub config file permissions
      ansible.builtin.file:
        path: '/boot/grub/grub.cfg'
        mode: '0600'
        owner: root
        group: root

    - name: Disable uncommon filesystems
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '/etc/modprobe.d'
        mode: '0600'
        owner: root
        group: root
      loop:
        - '{{ ubuntu.local_path.config }}/disable-unusual-filesystems.conf'
        # - '{{ ubuntu.local_path.config }}/disable-usb-storage.conf'
      notify:
        - Modprobe config changed

    - name: Copy hardened sysctl config
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '/etc/sysctl.d'
        mode: '0600'
        owner: root
        group: root
      loop:
        - '{{ ubuntu.local_path.config }}/hardened-networking.conf'
        - '{{ ubuntu.local_path.config }}/disable-suid-coredumps.conf'
        - '{{ ubuntu.local_path.config }}/enable-aslr-memory.conf'
      notify:
        - Sysctl config changed

    - name: Disable apport service
      ansible.builtin.systemd_service:
        name: apport
        state: stopped
        enabled: false
        masked: true

    - name: Uninstall unnecessary and insecure packages
      ansible.builtin.apt:
        name: '{{ item }}'
        state: absent
      loop:
        - ftp
        - tnftp
        - telnet
        - rsync

    - name: Copy SSH banner message (issue.net)
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/issue.net'
        dest: '/etc/issue.net'
        mode: '0644'

    - name: Create sshd_config.d directory
      ansible.builtin.file:
        path: '/etc/ssh/sshd_config.d'
        state: directory
        mode: '0600'

    - name: Copy hardened sshd config
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/00-hardened-sshd.conf'
        dest: '/etc/ssh/sshd_config.d/00-hardened-sshd.conf'
        mode: '0600'
      notify:
        - Sshd config changed

    - name: Restrict sshd config file permissions
      ansible.builtin.file:
        path: '/etc/ssh/sshd_config'
        mode: '0600'
        owner: root
        group: root

  handlers:
    - name: Sshd config changed
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Modprobe config changed
      ansible.builtin.debug:
        msg: Modprobe config has changed, a reboot is recommended

    - name: Sysctl config changed
      # noqa no-changed-when
      ansible.builtin.command: 'sysctl --system'
