# vars from group_vars/vpn_servers.yml

- name: Update and install packages
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Update apt cache and all packages
      # noqa package-latest
      ansible.builtin.apt:
        name: '*'
        state: latest
        update_cache: true

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - openssh-server
          - openssh-client
        state: present
        update_cache: true

- name: Enable automatic package updates
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Install unattended-upgrades package
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Copy unattended-upgrades configuration
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/50unattended-upgrades'
        dest: '/etc/apt/apt.conf.d/50unattended-upgrades'
        mode: '0644'
      notify:
        - Unattended-upgrades config changed

  handlers:
    - name: Unattended-upgrades config changed
      ansible.builtin.service:
        name: unattended-upgrades
        state: restarted

- name: Configure firewall
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Install ufw package
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Uninstall iptables-persistent to avoid conflits with ufw
      ansible.builtin.apt:
        name: iptables-persistent
        state: absent

    - name: Enable ufw and set default policy to deny
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Enable TCP ports
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
      loop:
        - 443 # https
        - 22 # ssh

- name: Miscellaneous configuration
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Set the timezone
      community.general.timezone:
        name: '{{ timezone }}'

    - name: Create timesyncd.conf.d directory
      ansible.builtin.file:
        path: '/etc/systemd/timesyncd.conf.d'
        state: directory
        mode: '0644'

    - name: Copy NTP servers config
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/00-ntp-servers.conf'
        dest: '/etc/systemd/timesyncd.conf.d/00-ntp-servers.conf'
        mode: '0644'
      notify:
        - NTP config changed

  handlers:
    - name: NTP config changed
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted


- name: Enable general hardening measures
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Disable apport service
      ansible.builtin.service:
        name: apport
        state: stopped
        enabled: false

    - name: Uninstall unnecessary and insecure packages
      ansible.builtin.apt:
        name: '{{ item }}'
        state: absent
      loop:
        - ftp
        - tnftp
        - telnet
        - rsync

    - name: Copy SSH banner message (issue.net)
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/issue.net'
        dest: '/etc/issue.net'
        mode: '0644'

    - name: Create sshd_config.d directory
      ansible.builtin.file:
        path: '/etc/ssh/sshd_config.d'
        state: directory
        mode: '0600'

    - name: Copy hardened sshd config
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/00-hardened-sshd.conf'
        dest: '/etc/ssh/sshd_config.d/00-hardened-sshd.conf'
        mode: '0600'
      notify:
        - Sshd config changed

    - name: Restrict sshd config file permissions
      ansible.builtin.file:
        path: '/etc/ssh/sshd_config'
        mode: '0600'
        owner: root
        group: root

  handlers:
    - name: Sshd config changed
      ansible.builtin.service:
        name: ssh
        state: restarted
