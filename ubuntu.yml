# vars from group_vars/vpn_servers.yml

- name: Update and install packages
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Update apt cache and all packages
      # noqa package-latest
      ansible.builtin.apt:
        name: '*'
        state: latest
        update_cache: true

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - openssh-server
          - openssh-client
        state: present
        update_cache: true

- name: Enable automatic package updates
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Install unattended-upgrades package
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Copy unattended-upgrades configuration
      ansible.builtin.copy:
        src: '{{ ubuntu.local_path.config }}/50unattended-upgrades'
        dest: '/etc/apt/apt.conf.d/50unattended-upgrades'
        mode: '0644'
      notify:
        - Unattended-upgrades config changed

  handlers:
    - name: Unattended-upgrades config changed
      ansible.builtin.service:
        name: unattended-upgrades
        state: restarted

- name: Configure firewall
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Install ufw package
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Uninstall iptables-persistent to avoid conflits with ufw
      ansible.builtin.apt:
        name: iptables-persistent
        state: absent

    - name: Enable ufw and set default policy to deny
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Enable TCP ports
      community.general.ufw:
        rule: allow
        port: '{{ item }}'
        proto: tcp
      loop:
        - 443 # https
        - 22 # ssh

- name: Miscellaneous configuration
  hosts: vpn_servers
  # root
  become: true

  tasks:
    - name: Set the timezone
      community.general.timezone:
        name: '{{ timezone }}'

- name: Enable build hardening measures
  hosts: vpn_servers
  # root
  become: true

